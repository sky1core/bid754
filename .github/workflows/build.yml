name: CI

on:
  push:
    # Branch pushes only: release tags point at already-tested commits, so
    # tag pushes would just rerun the same commit (3 duplicate runs per
    # release) and burn external-download quota.
    branches: ["**"]
  pull_request:

env:
  VERIFY_INVOCATION: ${{ github.run_id }}:${{ github.run_attempt }}
  GIT_AUTHOR_NAME: bid754-verification
  GIT_AUTHOR_EMAIL: bid754-verification@example.invalid
  GIT_COMMITTER_NAME: bid754-verification
  GIT_COMMITTER_EMAIL: bid754-verification@example.invalid

jobs:
  portable-test:
    name: Portable Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: bid754-go/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up Rust
        run: |
          # The minimal profile omits clippy, which make test-rust runs as the
          # lint gate for the generated public API; request it explicitly.
          rust_version=$(cat devtools/rust-version)
          rustup toolchain install "$rust_version" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bid754-codec-js/package-lock.json

      # test-bidcodec (devtools/scripts/test_bidcodec.sh) requires rg, which
      # hosted runners do not ship by default.
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          else
            brew install ripgrep
          fi

      - name: Verify required toolchains
        run: |
          go version
          rustc --version
          cargo --version
          cargo clippy --version
          javac -version
          java -version
          python3 --version
          npm --version
          swift --version
          rg --version

      # Cache the pinned, platform-independent source archives so a
      # netlib/speleotrove outage can't fail the run once any run has populated
      # them (make verify-generated calls setup_generation_inputs.sh, which
      # downloads them). The key hashes the provisioning script, which carries
      # the pinned URLs + sha256: a pin bump re-keys and forces a fresh
      # download, so a stale archive is never served under a changed pin, and
      # the OS-agnostic key lets every job share one download. The script still
      # re-verifies the sha256 on every restore, hit or miss.
      - name: Restore pinned generation input archives (Intel BID + IBM decTest)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            devtools/third_party/intel_dfp/IntelRDFPMathLib20U4.tar.gz
            devtools/tests/dectest.zip
          key: pinned-gen-inputs-${{ hashFiles('devtools/scripts/setup_generation_inputs.sh') }}

      - name: Prepare pinned generation inputs
        run: bash ./devtools/scripts/setup_generation_inputs.sh all

      - name: Run required portable verification profile
        run: make verify-profile VERIFY_PROFILE=ci-portable

      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-portable-${{ matrix.os }}
          path: test_results/verification/
          if-no-files-found: error

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-digest-${{ matrix.os }}
          path: test_results/digest_*.txt
          if-no-files-found: error

      - name: Run doctor
        run: make doctor

  # Linux arm64: Intel BID C oracle does not build here (upstream makefile is
  # x86-only), so this job verifies the operational paths (Go portable + Rust)
  # and the platform-independent fixed vectors instead of native FFI bit-compare.
  # See PLATFORM_SPEC.md section 1 and 4.
  portable-arm64-linux:
    name: Portable arm64 Linux
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: bid754-go/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up Rust
        run: |
          # The minimal profile omits clippy, which make test-rust runs as the
          # lint gate for the generated public API; request it explicitly.
          rust_version=$(cat devtools/rust-version)
          rustup toolchain install "$rust_version" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"

      - name: Verify toolchains
        run: |
          go version
          uname -m
          rustc --version
          cargo --version
          cargo clippy --version

      # Pinned-archive cache (see the portable-test job for the full rationale):
      # keyed on the provisioning script hash, OS-agnostic, sha256 re-verified
      # on every restore.
      - name: Restore pinned generation input archives (Intel BID + IBM decTest)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            devtools/third_party/intel_dfp/IntelRDFPMathLib20U4.tar.gz
            devtools/tests/dectest.zip
          key: pinned-gen-inputs-${{ hashFiles('devtools/scripts/setup_generation_inputs.sh') }}

      - name: Prepare pinned generation inputs (internal/cgen and internal/csymbols read the extracted Intel BID C sources; the Go-port decTest gate reads the pinned IBM decTest files at run time)
        run: bash ./devtools/scripts/setup_generation_inputs.sh all

      - name: Run required portable verification profile
        run: make verify-profile VERIFY_PROFILE=portable

      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-portable-linux-arm64
          path: test_results/verification/
          if-no-files-found: error

      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-digest-ubuntu-24.04-arm
          path: test_results/digest_*.txt
          if-no-files-found: error

  platform-digest:
    name: Cross-platform bit comparison
    needs: [portable-test, portable-arm64-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: platform-digest-*
          path: test_results/ci-digests
          merge-multiple: true

      - name: Compare all guaranteed platforms at this commit
        run: >-
          bash devtools/scripts/verify_digest.sh
          --results-dir test_results/ci-digests
          --expected-tree "$(bash devtools/scripts/print_tree_id.sh)"
          --require-platform darwin/arm64
          --require-platform linux/amd64
          --require-platform linux/arm64

  # Native FFI bit-compare against the live Intel BID C oracle, run on both
  # platforms where Intel BID builds (Linux amd64 and macOS arm64). Together
  # with the portable arm64 Linux job above these cross-cover the guaranteed
  # matrix. See PLATFORM_SPEC.md section 4.
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: bid754-go/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up Rust
        run: |
          rust_version=$(cat devtools/rust-version)
          rustup toolchain install "$rust_version" --profile minimal --component clippy
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"

      # Pinned-archive caches (see the portable-test job for the full
      # rationale): keyed on each provisioning script's hash, OS-agnostic,
      # sha256 re-verified on every restore. decNumber is cached separately
      # because only this job builds it.
      - name: Restore pinned generation input archives (Intel BID + IBM decTest)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            devtools/third_party/intel_dfp/IntelRDFPMathLib20U4.tar.gz
            devtools/tests/dectest.zip
          key: pinned-gen-inputs-${{ hashFiles('devtools/scripts/setup_generation_inputs.sh') }}

      - name: Restore pinned IBM decNumber archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: devtools/third_party/ibm_decnumber/decNumber-icu-368.zip
          key: pinned-decnumber-${{ hashFiles('devtools/scripts/install_ibm_decnumber.sh') }}

      - name: Prepare pinned generation inputs (Intel BID C sources and IBM decTest originals)
        run: bash ./devtools/scripts/setup_generation_inputs.sh

      - name: Install IBM decNumber
        run: bash ./devtools/scripts/install_ibm_decnumber.sh

      - name: Prepare Intel BID and env (-ffp-contract=off)
        run: bash ./devtools/scripts/setup_c_libs.sh

      - name: Run doctor
        run: make doctor

      - name: Run required native verification profile
        run: make verify-profile VERIFY_PROFILE=native

      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verification-native-${{ matrix.os }}
          path: test_results/verification/
          if-no-files-found: error

  verification-summary:
    name: Required verification evidence
    needs: [portable-test, portable-arm64-linux, native, platform-digest]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: bid754-go/go.mod
          cache: false

      - name: Download verification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: verification-*
          path: test_results/ci-verification
          merge-multiple: true

      - name: Adjudicate required profiles and platforms
        working-directory: devtools
        run: >-
          go run ./cmd/verifyplan matrix --root ..
          --results ../test_results/ci-verification
          --invocation "$VERIFY_INVOCATION"
