name: CI

on:
  push:
    # Branch pushes only: release tags point at already-tested commits, so
    # tag pushes would just rerun the same commit (3 duplicate runs per
    # release) and burn external-download quota.
    branches: ["**"]
  pull_request:

jobs:
  portable-test:
    name: Portable Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: bid754-go/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bid754-codec-js/package-lock.json

      # test-bidcodec (devtools/scripts/test_bidcodec.sh) requires rg, which
      # hosted runners do not ship by default.
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          else
            brew install ripgrep
          fi

      - name: Verify required toolchains
        run: |
          go version
          rustc --version
          cargo --version
          javac -version
          java -version
          python3 --version
          npm --version
          swift --version
          rg --version

      # Cache the pinned, platform-independent source archives so a
      # netlib/speleotrove outage can't fail the run once any run has populated
      # them (make verify-generated calls setup_generation_inputs.sh, which
      # downloads them). The key hashes the provisioning script, which carries
      # the pinned URLs + sha256: a pin bump re-keys and forces a fresh
      # download, so a stale archive is never served under a changed pin, and
      # the OS-agnostic key lets every job share one download. The script still
      # re-verifies the sha256 on every restore, hit or miss.
      - name: Restore pinned generation input archives (Intel BID + IBM decTest)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            devtools/third_party/intel_dfp/IntelRDFPMathLib20U4.tar.gz
            devtools/tests/dectest.zip
          key: pinned-gen-inputs-${{ hashFiles('devtools/scripts/setup_generation_inputs.sh') }}

      - name: Verify generated artifacts
        run: make verify-generated

      - name: Verify the tree is clean after regeneration
        run: git status --porcelain && git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Run structural verification (zero deps, portable purity, vet, package versions)
        run: |
          make verify-zero-deps
          make verify-portable-purity
          make vet-go-modules
          make verify-package-versions

      - name: Run Go and Rust tests
        run: make test-all

      # BID string generated verification. Runs make verify-generated first
      # (already done above; regeneration is deterministic so the tree stays
      # clean), then cross-checks the generated BID string vectors across the
      # Go and Rust consumers. Needs ripgrep, installed on this job above.
      - name: Run BID string generated verification (runs make verify-generated first)
        run: make test-bid-string

      # Go race detector gate for the concurrent-use contract of the public
      # runtime modules. Portable (Go-only, no native/Intel prerequisite), so
      # it belongs on this job where the Go toolchain is already set up; the
      # ubuntu/macos matrix additionally covers the amd64 and arm64 runtimes.
      # Cost is ~30s and it runs in parallel with the other jobs.
      - name: Run Go race detector (bid754-go + bid754-codec-go concurrency gate)
        run: make test-race

      - name: Run doctor
        run: make doctor

  # Linux arm64: Intel BID C oracle does not build here (upstream makefile is
  # x86-only), so this job verifies the operational paths (Go portable + Rust)
  # and the platform-independent fixed vectors instead of native FFI bit-compare.
  # See PLATFORM_SPEC.md section 1 and 4.
  portable-arm64-linux:
    name: Portable arm64 Linux
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: bid754-go/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify toolchains
        run: |
          go version
          uname -m
          rustc --version

      # Pinned-archive cache (see the portable-test job for the full rationale):
      # keyed on the provisioning script hash, OS-agnostic, sha256 re-verified
      # on every restore.
      - name: Restore pinned generation input archives (Intel BID + IBM decTest)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            devtools/third_party/intel_dfp/IntelRDFPMathLib20U4.tar.gz
            devtools/tests/dectest.zip
          key: pinned-gen-inputs-${{ hashFiles('devtools/scripts/setup_generation_inputs.sh') }}

      - name: Prepare pinned generation inputs (internal/cgen and internal/csymbols read the extracted Intel BID C sources; the Go-port decTest gate reads the pinned IBM decTest files at run time)
        run: bash ./devtools/scripts/setup_generation_inputs.sh all

      - name: Run Go module tests (includes fixed string vectors and the Go-port gates TestGeneratedReadCasesGoPort and TestGeneratedDectestSuitesGoPort)
        run: make test-go-modules

      - name: Run Rust portable tests (fixed string/codec vectors; the Rust readtest oracle gate runs in the native job via the ffi-verify crate)
        run: make test-rust

  # Native FFI bit-compare against the live Intel BID C oracle, run on both
  # platforms where Intel BID builds (Linux amd64 and macOS arm64). Together
  # with the portable arm64 Linux job above these cross-cover the guaranteed
  # matrix. See PLATFORM_SPEC.md section 4.
  native:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: bid754-go/go.mod
          cache-dependency-path: "**/go.sum"

      # Pinned-archive caches (see the portable-test job for the full
      # rationale): keyed on each provisioning script's hash, OS-agnostic,
      # sha256 re-verified on every restore. decNumber is cached separately
      # because only this job builds it.
      - name: Restore pinned generation input archives (Intel BID + IBM decTest)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            devtools/third_party/intel_dfp/IntelRDFPMathLib20U4.tar.gz
            devtools/tests/dectest.zip
          key: pinned-gen-inputs-${{ hashFiles('devtools/scripts/setup_generation_inputs.sh') }}

      - name: Restore pinned IBM decNumber archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: devtools/third_party/ibm_decnumber/decNumber-icu-368.zip
          key: pinned-decnumber-${{ hashFiles('devtools/scripts/install_ibm_decnumber.sh') }}

      - name: Prepare pinned generation inputs (Intel BID C sources and IBM decTest originals)
        run: bash ./devtools/scripts/setup_generation_inputs.sh

      - name: Install IBM decNumber
        run: bash ./devtools/scripts/install_ibm_decnumber.sh

      - name: Prepare Intel BID and env (-ffp-contract=off)
        run: bash ./devtools/scripts/setup_c_libs.sh

      - name: Run doctor
        run: make doctor

      - name: Run native smoke tests
        run: make test-native-smoke

      - name: Run generated FFI bit-compare
        run: make test-native-ffi

      - name: Run Tier 1 arithmetic long exact differential
        run: make _test-native-tier1-arithmetic-long-full

      - name: Run Tier 1 compare and conversion long exact differential
        run: make _test-native-tier1-compare-conversion-long-full

      - name: Run Rust Tier 1 arithmetic long exact differential
        run: make _test-rust-native-tier1-arithmetic-long-full

      - name: Run Rust Tier 1 compare and conversion long exact differential
        run: make _test-rust-native-tier1-compare-conversion-long-full

      - name: Run generated readtest suites
        run: make test-native-readtest

      - name: Run generated decTest suites
        run: make test-native-dectest

      - name: Run Rust native tests (readtest vs Intel BID oracle)
        run: make test-rust-native

      # Randomized Rust-vs-C differential fuzz (ffi-verify's ffi-fuzz feature).
      # Auxiliary, not a regular verification domain (see TEST_GENERATION_SPEC
      # "ffi-fuzz"); it needs the same Intel BID C oracle as the step above, so
      # it belongs on this native job. Cost is ~2s on top of the readtest build.
      - name: Run Rust ffi-fuzz auxiliary (Rust generated vs Intel BID oracle)
        run: make test-rust-native-fuzz

  script-check:
    name: Shell Script Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Validate shell scripts
        run: make check-scripts
