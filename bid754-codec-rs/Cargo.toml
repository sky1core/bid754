[package]
name = "bid754-codec"
version = "0.2.0"
edition = "2021"
description = "BID (Binary Integer Decimal) IEEE 754 codec for decimal floating-point interchange"
readme = "README.md"
homepage = "https://github.com/sky1core/bid754"
repository = "https://github.com/sky1core/bid754"
documentation = "https://docs.rs/bid754-codec"
license = "MIT"
keywords = ["ieee-754", "decimal", "bid", "codec", "floating-point"]
categories = ["encoding", "no-std", "mathematics"]
# crates.io publication is a separate user-approved release decision, same as
# bid754-rs; flip this deliberately at first release (cargo package still works).
publish = false
# The integration tests read the repo-level fixture
# (../bid754-codec-vectors/vectors.json) and the criterion benchmark leg reads
# the repo-level shared operand contract
# (../bid754-codec-go/testdata/codec_benchmark_operands.json), so both are
# excluded from the published package; they still run from a repo checkout.
exclude = ["tests/", "benches/"]

[features]
default = ["std"]
std = []

[dependencies]

[dev-dependencies]
# criterion is pinned to the same version as the bid754-rs benchmark leg.
criterion = "=0.5.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[[bench]]
name = "codec"
harness = false
